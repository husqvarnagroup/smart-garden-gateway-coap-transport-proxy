[package]
name = "coap-transport-proxy"
version = "0.8.3"
edition = "2021"
repository = "https://dev.azure.com/HQV-Gardena/SG-Gateway/_git/sg-coap-transport-proxy"
rust-version = "1.75.0"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "derive"] }
coap = "0.12"
coap-client = { git = "https://github.com/husqvarnagroup/rust-coap-client.git", rev = "eb8dc5bb6012cf91e38d87efe033267e01f9d47d" }
coap-lite = "0.9.1"
gardenalog =  { git = "https://github.com/husqvarnagroup/smart-garden-gateway-crates.git" }
hex = "0.4.3"
once_cell = "1.17.2"
openssl = "0.10.57"
rand = "0.8.5"
serde = { version = "1.0.164", features = ["derive"] }
serde_json = "1.0.97"
tokio = { version = "1.43.0", features = ["rt", "rt-multi-thread", "macros", "net", "io-util"] }
tokio-openssl = "0.6.3"
tracing = "0.1"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
